name: novispot
description: "Music player for Navidrome and local music libraries."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  crypto: ^3.0.8
  audioplayers: ^6.8.1
  file_picker: ^13.3.2
  path_provider: ^2.1.5
  metadata_god: ^1.1.0
  flutter_rust_bridge: 2.11.1
  os_media_controls:
    git:
      url: https://github.com/edde746/media_controls.git
  window_manager: ^0.6.0
  miniaudio_player: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/novispot.png

flutter_launcher_icons:
  android: true
  image_path: assets/icons/novispot.png
  adaptive_icon_background: "#101010"
  adaptive_icon_foreground: assets/icons/novispot.png
