name: Build Novispot Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag
        required: true
        default: v2.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows application
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace "^v", ""
          flutter build windows --release --build-name=$version --build-number=1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace "^v", ""
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/windows/novispot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Novispot ${{ inputs.release_tag }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: dist/Novispot-Setup-*.exe
