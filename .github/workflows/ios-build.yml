name: Build Novispot iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"
  push:
    branches:
      - feature/android-mobile-experience
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org com.novispot --project-name novispot .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix miniaudio Objective-C compilation on iOS
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          package_dirs = list(cache.glob("hosted/pub.dev/miniaudio_player-3.0.2"))
          if not package_dirs:
              raise SystemExit("Could not find miniaudio_player 3.0.2 in PUB_CACHE")

          build_script = package_dirs[0] / "rust" / "build.rs"
          if not build_script.is_file():
              raise SystemExit(f"Could not find Rust native build script: {build_script}")

          source = build_script.read_text()
          if 'build.flag("-x").flag("objective-c");' not in source:
              if 'let target_os = std::env::var("CARGO_CFG_TARGET_OS")' not in source:
                  raise SystemExit("Rust build script has no target_os detection; refusing an unsafe patch")
              if "let mut build = cc::Build::new();" not in source:
                  raise SystemExit("Rust build script does not use cc::Build; refusing an unsafe patch")
              compile_at = source.rfind("build.compile(")
              if compile_at < 0:
                  raise SystemExit("Could not locate cc::Build compile call in Rust build script")

              patch = (
                  '    if target_os == "ios" {\n'
                  '        build.flag("-x").flag("objective-c");\n'
                  '    }\n\n'
              )
              source = source[:compile_at] + patch + source[compile_at:]
              build_script.write_text(source)

          print(f"Verified iOS Objective-C compiler flag in {build_script}")

          # Fail early if the exact conditional was not inserted.
          verify = build_script.read_text()
          if 'if target_os == "ios"' not in verify or 'build.flag("-x").flag("objective-c");' not in verify:
              raise SystemExit("Objective-C compiler flag verification failed")
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-name=2.0.0 --build-number=2

      - name: Package iOS app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Novispot-iOS-2.0.0-unsigned.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Novispot-iOS-2.0.0-unsigned
          path: build/ios/iphoneos/Novispot-iOS-2.0.0-unsigned.zip
          if-no-files-found: error
          retention-days: 14
