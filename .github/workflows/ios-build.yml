name: Build Novispot iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"
  push:
    branches:
      - feature/android-mobile-experience
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org com.novispot --project-name novispot .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Patch miniaudio iOS compiler mode
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          pub_cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          build_files = list((pub_cache / "hosted" / "pub.dev").glob("miniaudio_player-*/rust/build.rs"))
          if not build_files:
              raise SystemExit("miniaudio_player rust/build.rs was not found in PUB_CACHE")

          for path in build_files:
              source = path.read_text()
              if 'build.flag("-x").flag("objective-c");' in source:
                  print(f"Objective-C compiler mode already enabled: {path}")
                  continue

              marker = '    } else if target_os == "macos" || target_os == "ios" {\n'
              if marker not in source:
                  raise SystemExit(f"Unexpected miniaudio_player build.rs layout: {path}")

              replacement = marker + """        if target_os == "ios" {
                      build.flag("-x").flag("objective-c");
                      println!("cargo:rustc-link-lib=objc");
                      println!("cargo:rustc-link-lib=pthread");
                      println!("cargo:rustc-link-lib=m");
                      for framework in [
                          "Foundation",
                          "CoreFoundation",
                          "CoreAudio",
                          "AudioToolbox",
                          "AVFoundation",
                          "AVFAudio",
                          "UIKit",
                      ] {
                          println!("cargo:rustc-link-lib=framework={framework}");
                      }
                  }
          """
              path.write_text(source.replace(marker, replacement, 1))
              print(f"Patched iOS Objective-C compiler mode: {path}")
          PY

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-name=2.0.0 --build-number=2

      - name: Package iOS app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Novispot-iOS-2.0.0-unsigned.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Novispot-iOS-2.0.0-unsigned
          path: build/ios/iphoneos/Novispot-iOS-2.0.0-unsigned.zip
          if-no-files-found: error
          retention-days: 14
