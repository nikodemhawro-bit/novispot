name: Build Novispot iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"
  push:
    branches:
      - feature/android-mobile-experience
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org com.novispot --project-name novispot .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix miniaudio Objective-C compilation on iOS
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          package_dirs = list(cache.glob("hosted/pub.dev/miniaudio_player-3.0.2"))
          if not package_dirs:
              raise SystemExit("Could not find miniaudio_player 3.0.2 in PUB_CACHE")

          package = package_dirs[0]
          rust_builds = []
          for candidate in package.rglob("build.rs"):
              try:
                  source = candidate.read_text()
              except (OSError, UnicodeDecodeError):
                  continue
              if "cc::Build::new()" in source and "CARGO_CFG_TARGET_OS" in source and "build.compile(" in source:
                  rust_builds.append((candidate, source))

          if len(rust_builds) != 1:
              print("Package files (first 250):")
              for path in sorted(p for p in package.rglob("*") if p.is_file())[:250]:
                  print(path.relative_to(package))
              raise SystemExit(
                  f"Expected exactly one native cc build.rs, found {len(rust_builds)}; "
                  "refusing to modify an unknown file"
              )

          build_script, source = rust_builds[0]
          flag = 'build.flag("-x").flag("objective-c");'
          if flag not in source:
              compile_at = source.rfind("build.compile(")
              if compile_at < 0:
                  raise SystemExit("Could not locate native C compile call")
              patch = (
                  '    if target_os == "ios" {\\n'
                  f'        {flag}\\n'
                  '    }\\n\\n'
              )
              source = source[:compile_at] + patch + source[compile_at:]
              build_script.write_text(source)

          verified = build_script.read_text()
          if 'if target_os == "ios"' not in verified or flag not in verified:
              raise SystemExit("Objective-C flag verification failed")

          print(f"Verified Objective-C compilation patch: {build_script}")
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-name=2.0.0 --build-number=2

      - name: Package iOS app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Novispot-iOS-2.0.0-unsigned.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Novispot-iOS-2.0.0-unsigned
          path: build/ios/iphoneos/Novispot-iOS-2.0.0-unsigned.zip
          if-no-files-found: error
          retention-days: 14
